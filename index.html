<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今天吃什么｜软萌盲盒抽奖</title>
<style>
  :root{
    --cream:#fffaf1;
    --paper:#fff1c9;
    --paper-hi:#fff9df;
    --ink:#82483d;
    --ink-soft:#ac6b5e;
    --coral:#f28c88;
    --coral-deep:#d96466;
    --blush:#ffc5c1;
    --pink:#ffaaa9;
    --yellow:#ffd365;
    --yellow-hi:#fff0a4;
    --yellow-deep:#e8a83d;
    --panel:rgba(255,251,246,.84);
    --edge:rgba(222,126,113,.42);
    --soft-shadow:0 12px 30px rgba(151,84,69,.13);
    --font-display:"YouYuan","幼圆","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;margin:0;overflow:hidden}
  body{
    color:var(--ink);
    background:#ecd2c6;
    font-family:var(--font-body);
    overscroll-behavior:none;
  }
  button,input{font:inherit;color:inherit}
  button{border:0;cursor:pointer}
  button:focus-visible,input:focus-visible{
    outline:3px solid rgba(239,136,132,.48);
    outline-offset:3px;
  }

  .desktop-shell{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 18% 10%,rgba(255,255,255,.64),transparent 28%),
      radial-gradient(circle at 84% 88%,rgba(255,232,218,.9),transparent 30%),
      linear-gradient(135deg,#e7c9bc,#f1ded5 48%,#e5c6b9);
  }
  .app{
    position:relative;
    width:min(100vw,430px);
    height:min(100dvh,860px);
    margin:auto;
    top:50%;
    transform:translateY(-50%);
    overflow:hidden;
    isolation:isolate;
    border:4px solid rgba(255,255,255,.82);
    border-radius:38px;
    background:#fff8f1;
    box-shadow:0 28px 70px rgba(103,56,46,.2);
  }
  .art-bg{
    position:absolute;inset:0;z-index:-3;
    background:url("assets/app-background.png") center/cover no-repeat;
  }
  .art-wash{
    position:absolute;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(circle at 50% 21%,rgba(255,255,255,.3),transparent 30%),
      linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,244,237,.06));
  }
  .grain{
    position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.16;
    background-image:radial-gradient(rgba(116,65,55,.24) .45px,transparent .7px);
    background-size:7px 7px;
    mix-blend-mode:multiply;
  }

  .screen{
    position:absolute;inset:0;
    padding:
      max(13px,env(safe-area-inset-top))
      16px
      max(14px,env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    opacity:0;
    transform:translateX(18px) scale(.985);
    pointer-events:none;
    visibility:hidden;
    transition:opacity .36s ease,transform .48s cubic-bezier(.2,.82,.22,1),visibility 0s .48s;
  }
  .screen.active{
    opacity:1;transform:none;pointer-events:auto;visibility:visible;
    transition:opacity .36s ease,transform .48s cubic-bezier(.2,.82,.22,1);
  }

  .header{
    flex:0 0 auto;
    position:relative;
    text-align:center;
    z-index:5;
  }
  .step-pill{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:184px;
    height:40px;
    padding:0 22px;
    border:1.5px solid rgba(255,255,255,.78);
    border-radius:18px 18px 23px 23px;
    color:#fff;
    background:linear-gradient(180deg,#ffc8c6,#f5a4a5);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.45),
      0 5px 0 rgba(220,112,112,.32),
      0 9px 22px rgba(212,112,105,.18);
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    letter-spacing:.08em;
  }
  .step-pill::before,.step-pill::after{
    content:"";position:absolute;top:7px;width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.42);
  }
  .step-pill::before{left:10px}.step-pill::after{right:10px}
  .title{
    margin:15px 0 2px;
    white-space:nowrap;
    font-family:var(--font-display);
    font-size:34px;
    line-height:1.08;
    font-weight:700;
    letter-spacing:.08em;
    color:#914f42;
    text-shadow:0 2px 0 #fff,0 5px 12px rgba(131,74,62,.12);
  }
  .title span{display:inline-block}
  .title span:nth-child(1){transform:rotate(-3deg) translateY(1px)}
  .title span:nth-child(2){transform:rotate(2deg) translateY(-1px)}
  .title span:nth-child(3){transform:rotate(-1deg)}
  .title span:nth-child(4){transform:rotate(2deg) translateY(1px)}
  .title span:nth-child(5){transform:rotate(-2deg)}
  .title span:nth-child(6){transform:rotate(3deg) translateY(-1px)}
  .title span:nth-child(7){transform:rotate(-2deg)}
  .subtitle{
    display:flex;align-items:center;justify-content:center;gap:9px;
    color:#aa6557;font-family:"STKaiti","KaiTi","Kaiti SC",serif;
    font-size:15px;font-weight:700;letter-spacing:.12em;
  }
  .subtitle::before,.subtitle::after{
    content:"";width:28px;height:2px;border-radius:9px;background:#db9180;
  }

  .choice-panel{
    flex:0 0 auto;
    margin-top:16px;
    padding:14px 13px 12px;
    border:2px dashed rgba(239,151,143,.52);
    border-radius:25px;
    background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,247,238,.73));
    box-shadow:inset 0 1px 0 #fff,var(--soft-shadow);
    backdrop-filter:blur(7px);
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:11px;
  }
  .panel-title{
    min-width:0;font-size:14px;font-weight:800;letter-spacing:.04em;
  }
  .edit-btn{
    flex:0 0 auto;
    min-width:74px;height:34px;padding:0 13px;
    border:1.5px solid #ecc2a6;border-radius:999px;
    color:#a76152;background:linear-gradient(#fffdf6,#fff0de);
    box-shadow:0 3px 0 #efd4c0;
    font-size:13px;font-weight:800;
  }
  .edit-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #efd4c0}
  .food-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
  .food-card{
    position:relative;
    min-width:0;
    min-height:67px;
    padding:7px 3px 6px;
    border:1.5px solid #e5b776;
    border-radius:7px 10px 8px 11px;
    color:var(--ink);
    background:
      linear-gradient(135deg,rgba(255,255,255,.55),transparent 34%),
      linear-gradient(180deg,var(--paper-hi),var(--paper));
    box-shadow:0 4px 0 #e7bf89,0 7px 11px rgba(147,86,65,.12);
    transform:rotate(var(--tilt));
    transition:transform .18s ease,opacity .18s ease,filter .18s ease,box-shadow .18s ease;
  }
  .food-card:nth-child(4n+1){--tilt:-1.5deg}
  .food-card:nth-child(4n+2){--tilt:1deg}
  .food-card:nth-child(4n+3){--tilt:-.6deg}
  .food-card:nth-child(4n){--tilt:1.4deg}
  .food-card::before{
    content:"";position:absolute;left:50%;top:-5px;translate:-50% 0;
    width:8px;height:8px;border:1px solid #dc8274;border-radius:50%;
    background:#ffa69c;box-shadow:inset 0 1px 0 #ffd9cf;
  }
  .food-card.selected{
    outline:2px solid rgba(244,132,127,.72);
    outline-offset:2px;
  }
  .food-card.off{opacity:.42;filter:grayscale(.55);transform:rotate(var(--tilt)) scale(.94)}
  .food-card:active{transform:rotate(var(--tilt)) translateY(2px) scale(.98)}
  .doodle{height:37px;display:grid;place-items:center}
  .doodle svg{width:44px;height:35px;overflow:visible;filter:drop-shadow(0 1px 0 rgba(255,255,255,.7))}
  .food-name{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-align:center;font-size:11px;font-weight:800;
  }
  .selection-note{
    margin-top:9px;text-align:center;color:#ae7162;
    font-size:11px;font-weight:700;
  }

  .hero{
    position:relative;
    flex:1 1 auto;
    min-height:190px;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .box-stage{
    position:relative;
    width:min(82vw,330px);
    aspect-ratio:1/1;
    display:grid;place-items:center;
    margin-bottom:-25px;
    filter:drop-shadow(0 13px 10px rgba(151,82,65,.14));
  }
  .box-art{
    display:block;width:100%;height:100%;object-fit:contain;
    user-select:none;-webkit-user-drag:none;
  }
  .speech{
    position:absolute;z-index:3;right:2px;top:26px;
    width:92px;padding:12px 9px 13px;
    border:1.5px solid #efbca7;
    border-radius:48% 52% 46% 54%/54% 47% 53% 46%;
    background:rgba(255,253,247,.94);
    box-shadow:0 7px 18px rgba(153,89,68,.12);
    color:#9b5d50;
    font-family:"STKaiti","KaiTi","Kaiti SC",serif;
    font-size:13px;font-weight:700;line-height:1.42;text-align:center;
    transform:rotate(4deg);
  }
  .speech::after{
    content:"";position:absolute;left:8px;bottom:-9px;width:14px;height:14px;
    border-left:1.5px solid #efbca7;border-bottom:1.5px solid #efbca7;
    background:#fffdf7;transform:rotate(-35deg);
  }

  .action-wrap{position:relative;z-index:8;flex:0 0 auto}
  .primary-btn,.secondary-btn{
    width:100%;height:56px;
    border:2px solid var(--yellow-deep);
    border-radius:999px;
    color:#99543f;
    background:
      radial-gradient(circle at 18% 28%,rgba(255,255,255,.68) 0 4px,transparent 5px),
      linear-gradient(180deg,var(--yellow-hi),var(--yellow));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.64),0 5px 0 #e7a93f,0 10px 22px rgba(218,150,48,.2);
    font-family:var(--font-display);
    font-size:19px;font-weight:700;letter-spacing:.1em;
    transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
  }
  .primary-btn::before{content:"✦";margin-right:8px;color:#dc8c45}
  .primary-btn:active,.secondary-btn:active{transform:translateY(4px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #df9d38}
  .primary-btn:disabled{opacity:.48;filter:grayscale(.28);cursor:not-allowed}
  .secondary-btn{
    border-color:#d97069;
    color:#8f4c42;
    background:linear-gradient(180deg,#ffe1da,#ffaaa5);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 #cf6c67,0 10px 20px rgba(201,98,92,.18);
    font-size:16px;
  }

  /* 飞入状态 */
  .fly-stage{
    position:relative;flex:1;min-height:0;margin-top:9px;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .fly-stage .box-stage{width:min(88vw,354px);margin-bottom:-10px}
  .flying-area{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:visible}
  .flying-slip{
    position:absolute;left:50%;top:22%;
    width:72px;height:76px;margin-left:-36px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:1.5px solid #dda96c;border-radius:8px 11px 7px 10px;
    background:linear-gradient(155deg,#fffbe6,#ffe9b4);
    box-shadow:0 8px 14px rgba(128,75,59,.14);
    opacity:0;
    transform:translate(var(--sx),var(--sy)) rotate(var(--rot));
  }
  .flying-slip::before{
    content:"";position:absolute;left:50%;top:-5px;translate:-50%;
    width:8px;height:8px;border:1px solid #d77e73;border-radius:50%;background:#ffa79d;
  }
  .flying-slip.fly{animation:paper-flight 1.5s cubic-bezier(.2,.72,.17,1) var(--delay) forwards}
  .mini-icon svg{width:35px;height:28px}
  .flying-slip span{font-size:11px;font-weight:800}
  @keyframes paper-flight{
    0%{opacity:0;transform:translate(var(--sx),var(--sy)) rotate(var(--rot)) scale(.78)}
    9%{opacity:1}
    54%{opacity:1;transform:translate(calc(var(--sx)*.34),calc(var(--sy)*.08 + 34px)) rotate(calc(var(--rot)*-.35)) scale(.94)}
    78%{opacity:1;transform:translate(calc(var(--sx)*.1),148px) rotate(1deg) scale(.6)}
    100%{opacity:0;transform:translate(0,190px) rotate(0) scale(.18)}
  }
  .glow-ring{
    position:absolute;z-index:4;left:50%;bottom:37%;translate:-50% 0;
    width:190px;height:92px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,241,134,.96),rgba(255,214,88,.3) 43%,transparent 72%);
    filter:blur(2px);animation:glow-pulse 1.1s ease-in-out infinite;
  }
  @keyframes glow-pulse{50%{opacity:.66;transform:scale(1.12)}}
  .status-pill{
    position:absolute;z-index:8;left:4px;right:4px;bottom:2px;
    min-height:48px;padding:10px 18px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.88);border-radius:999px;
    background:rgba(255,252,247,.92);
    box-shadow:var(--soft-shadow);
    color:#a86357;font-size:14px;font-weight:800;text-align:center;
  }
  .status-pill::before,.status-pill::after{content:"✦";margin:0 9px;color:#f1a9a1;font-size:11px}

  /* 摇盒状态 */
  .draw-caption{
    flex:0 0 auto;margin-top:28px;text-align:center;
    color:#ef857c;font-family:var(--font-display);
    font-size:38px;font-weight:700;letter-spacing:.12em;
    text-shadow:0 2px 0 #fff;transform:rotate(-3deg);
  }
  .draw-stage{
    position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  }
  .draw-stage .box-stage{width:min(91vw,365px);margin:0}
  .shake-target{width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 78%}
  .shake-target.shaking{animation:box-shake 1.18s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes box-shake{
    0%{transform:translateY(0) rotate(0)}
    9%{transform:translateY(-8px) rotate(-2deg)}
    18%{transform:translate(-9px,-5px) rotate(-5deg)}
    28%{transform:translate(11px,-4px) rotate(5.5deg)}
    39%{transform:translate(-12px,-3px) rotate(-6deg)}
    50%{transform:translate(11px,-2px) rotate(5deg)}
    61%{transform:translate(-8px,-1px) rotate(-3.8deg)}
    72%{transform:translate(6px,0) rotate(2.7deg)}
    84%{transform:translate(-3px,0) rotate(-1.2deg)}
    100%{transform:none}
  }
  .motion-lines{position:absolute;inset:20% -2% 12%;opacity:0;pointer-events:none;transition:.16s}
  .motion-lines.show{opacity:1}
  .motion-lines i{
    position:absolute;width:38px;height:6px;border-radius:999px;
    background:#ed827c;box-shadow:0 12px 0 #f3aaa0;
  }
  .motion-lines i:nth-child(1){left:1%;top:29%;transform:rotate(-58deg)}
  .motion-lines i:nth-child(2){left:0;top:60%;transform:rotate(-15deg)}
  .motion-lines i:nth-child(3){right:1%;top:29%;transform:rotate(58deg)}
  .motion-lines i:nth-child(4){right:0;top:60%;transform:rotate(15deg)}
  .draw-hint{
    flex:0 0 auto;margin-bottom:12px;padding:12px 18px;
    border:1px solid rgba(255,255,255,.82);border-radius:999px;
    background:rgba(255,252,247,.9);box-shadow:var(--soft-shadow);
    color:#a86b5e;font-size:13px;font-weight:800;text-align:center;
  }

  /* 结果状态 */
  .result-screen{overflow:hidden}
  .ribbon{
    position:relative;z-index:8;align-self:center;flex:0 0 auto;
    margin-top:18px;padding:10px 29px 11px;
    border:2px solid #c95858;border-radius:13px;
    color:#fff;background:linear-gradient(#fa9994,#e76d6c);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 #c85859;
    font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.1em;
  }
  .ribbon::before,.ribbon::after{
    content:"";position:absolute;z-index:-1;top:9px;width:39px;height:34px;background:#e57370;
  }
  .ribbon::before{left:-29px;clip-path:polygon(0 0,100% 18%,100% 82%,0 100%,28% 50%)}
  .ribbon::after{right:-29px;clip-path:polygon(100% 0,0 18%,0 82%,100% 100%,72% 50%)}
  .result-stage{
    position:relative;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }
  .rays{
    position:absolute;left:50%;top:48%;translate:-50% -50%;
    width:540px;height:540px;border-radius:50%;
    background:repeating-conic-gradient(from -4deg,rgba(255,218,86,.25) 0 11deg,transparent 11deg 23deg);
    animation:rays-spin 22s linear infinite;
  }
  @keyframes rays-spin{to{transform:rotate(360deg)}}
  .result-box{position:absolute;left:50%;bottom:-45px;translate:-50%;width:min(91vw,365px);aspect-ratio:1}
  .result-box .box-art{width:100%;height:100%;object-fit:contain}
  .result-slip{
    position:absolute;z-index:7;left:50%;top:7%;translate:-50%;
    width:158px;height:176px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:2.5px solid #d99e57;border-radius:9px 13px 8px 12px;
    color:var(--ink);
    background:
      linear-gradient(135deg,rgba(255,255,255,.6),transparent 35%),
      linear-gradient(#fff8d9,#ffe59f);
    box-shadow:0 13px 25px rgba(125,70,53,.22);
    transform:rotate(-2deg);
    animation:result-pop .82s cubic-bezier(.17,.9,.24,1.12) both;
  }
  .result-slip::before{
    content:"";position:absolute;left:50%;top:-6px;translate:-50%;
    width:11px;height:11px;border:1.5px solid #d97d70;border-radius:50%;background:#ffaaa0;
  }
  @keyframes result-pop{
    from{opacity:0;translate:-50% 135px;transform:rotate(8deg) scale(.58)}
    to{opacity:1;translate:-50% 0;transform:rotate(-2deg) scale(1)}
  }
  .result-icon{height:82px;display:grid;place-items:center}
  .result-icon svg{width:98px;height:75px}
  .result-name{
    max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--font-display);font-size:27px;font-weight:700;letter-spacing:.08em;
  }
  .mascot{
    position:absolute;z-index:9;right:2px;bottom:3px;
    width:99px;height:148px;object-fit:contain;
    filter:drop-shadow(0 6px 7px rgba(132,73,57,.12));
    animation:mascot-in .7s .28s cubic-bezier(.17,.88,.3,1.2) both;
  }
  @keyframes mascot-in{from{opacity:0;transform:translate(35px,18px) rotate(7deg)}to{opacity:1;transform:none}}
  .result-bubble{
    position:absolute;z-index:10;right:5px;top:14%;width:83px;padding:10px 7px;
    border:1.5px solid #edbaa3;border-radius:50% 50% 46% 54%;
    background:#fffdf7;box-shadow:var(--soft-shadow);
    font-family:"STKaiti","KaiTi","Kaiti SC",serif;font-size:12px;font-weight:700;text-align:center;line-height:1.35;
    transform:rotate(5deg);
  }
  .celebration{position:absolute;inset:0;z-index:6;pointer-events:none}
  .celebration i{
    position:absolute;color:#ffc755;font-style:normal;
    animation:celebrate 1.3s ease-in-out infinite alternate;
  }
  .celebration i:nth-child(1){left:5%;top:18%;font-size:28px}
  .celebration i:nth-child(2){right:6%;top:38%;font-size:20px;animation-delay:.35s}
  .celebration i:nth-child(3){left:12%;bottom:24%;font-size:18px;animation-delay:.7s}
  @keyframes celebrate{to{transform:translateY(-7px) rotate(12deg) scale(1.08)}}
  .result-actions{
    position:relative;z-index:12;flex:0 0 auto;
    display:grid;grid-template-columns:.95fr 1.2fr;gap:10px;
  }

  /* 编辑抽屉 */
  .modal{
    position:absolute;inset:0;z-index:40;
    display:flex;align-items:flex-end;
    background:rgba(104,62,52,.28);
    backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:.24s ease;
  }
  .modal.show{opacity:1;visibility:visible;pointer-events:auto}
  .sheet{
    width:100%;
    padding:13px 18px max(18px,calc(12px + env(safe-area-inset-bottom)));
    border:2px solid rgba(255,255,255,.84);
    border-bottom:0;border-radius:29px 29px 0 0;
    background:linear-gradient(#fffdf8,#fff4ea);
    box-shadow:0 -18px 42px rgba(104,58,48,.2);
    transform:translateY(28px);transition:.3s cubic-bezier(.2,.8,.2,1);
  }
  .modal.show .sheet{transform:none}
  .sheet-handle{width:46px;height:5px;margin:0 auto 12px;border-radius:999px;background:#e8cfc5}
  .sheet h2{margin:0 0 5px;font-family:var(--font-display);font-size:21px;letter-spacing:.04em}
  .sheet p{margin:0 0 12px;color:#a66e61;font-size:12px}
  .edit-list{display:flex;flex-wrap:wrap;gap:7px;max-height:178px;overflow:auto;padding:3px}
  .edit-chip{
    display:flex;align-items:center;gap:6px;padding:7px 8px 7px 11px;
    border:1.5px solid #e5bd83;border-radius:999px;background:#fff0c9;
    font-size:12px;font-weight:800;
  }
  .edit-chip button{
    width:30px;height:30px;padding:0;border-radius:50%;
    color:#fff;background:#f29a94;font-size:18px;font-weight:700;line-height:30px;
  }
  .add-row{display:flex;gap:8px;margin-top:13px}
  .add-row input{
    flex:1;min-width:0;height:44px;padding:0 13px;
    border:1.5px solid #e9baa6;border-radius:14px;background:#fffdf9;outline:none;
  }
  .add-row button{min-width:72px;border-radius:14px;background:#ffd365;font-weight:800}
  .sheet-actions{display:flex;gap:9px;margin-top:13px}
  .sheet-actions button{flex:1;min-height:44px;border-radius:14px;font-weight:800}
  .cancel{background:#efe2dc}.save{color:#fff;background:#f2a09d}

  .toast{
    position:absolute;z-index:60;left:50%;top:max(18px,env(safe-area-inset-top));
    max-width:calc(100% - 32px);padding:9px 15px;
    border:1px solid rgba(255,255,255,.4);border-radius:999px;
    color:#fff;background:rgba(119,67,57,.94);
    box-shadow:0 8px 18px rgba(88,45,37,.2);
    font-size:12px;font-weight:800;white-space:nowrap;
    opacity:0;pointer-events:none;transform:translate(-50%,-18px);
    transition:.25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:460px){
    .app{width:100vw;height:100dvh;top:0;transform:none;border:0;border-radius:0;box-shadow:none}
  }
  @media (max-height:730px){
    .screen{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(9px,env(safe-area-inset-bottom))}
    .step-pill{height:34px;min-width:168px;font-size:13px}
    .title{margin-top:9px;font-size:28px}
    .subtitle{font-size:12px}
    .choice-panel{margin-top:10px;padding:11px 11px 9px}
    .panel-head{margin-bottom:8px}
    .food-grid{gap:7px}
    .food-card{min-height:56px;padding-top:5px}
    .doodle{height:29px}.doodle svg{width:38px;height:29px}
    .selection-note{margin-top:7px}
    .hero{min-height:142px}
    .box-stage{width:min(70vw,275px);margin-bottom:-34px}
    .speech{top:15px;width:78px;padding:9px 7px;font-size:11px}
    .primary-btn,.secondary-btn{height:50px;font-size:17px}
    .fly-stage{margin-top:3px}.fly-stage .box-stage{width:min(76vw,300px)}
    .draw-caption{margin-top:17px;font-size:32px}
    .draw-stage .box-stage{width:min(78vw,310px)}
    .draw-hint{margin-bottom:8px;padding:9px 14px;font-size:12px}
    .ribbon{margin-top:12px;padding:8px 25px;font-size:18px}
    .result-box{width:min(78vw,310px);bottom:-52px}
    .result-slip{top:4%;width:140px;height:154px}
    .result-icon{height:70px}.result-icon svg{width:86px;height:66px}
    .result-name{font-size:24px}
    .mascot{width:80px;height:121px}
  }
  @media (max-height:600px){
    .subtitle,.selection-note{display:none}
    .choice-panel{padding-bottom:8px}
    .food-card{min-height:50px}
    .hero{min-height:100px}
    .box-stage{width:205px;margin-bottom:-42px}
    .speech{display:none}
  }
  @media (orientation:landscape) and (max-height:520px){
    .app::after{
      content:"竖屏体验更完整哦";
      position:absolute;z-index:80;inset:0;
      display:grid;place-items:center;
      color:var(--ink);background:rgba(255,248,239,.96);
      font-family:var(--font-display);font-size:22px;font-weight:700;
    }
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="desktop-shell"></div>
<main class="app" aria-label="今天吃什么抽奖应用">
  <div class="art-bg" aria-hidden="true"></div>
  <div class="art-wash" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite">至少选两项哦</div>

  <section class="screen active" id="screen-select" aria-hidden="false">
    <header class="header">
      <div class="step-pill">步骤 1 · 挑选美食</div>
      <h1 class="title" aria-label="今天吃什么呢？"><span>今</span><span>天</span><span>吃</span><span>什</span><span>么</span><span>呢</span><span>？</span></h1>
      <div class="subtitle">抽个盲盒决定吧</div>
    </header>
    <div class="choice-panel">
      <div class="panel-head">
        <div class="panel-title">本次抽奖内容</div>
        <button class="edit-btn" id="editBtn">✎ 编辑</button>
      </div>
      <div class="food-grid" id="foodGrid"></div>
      <div class="selection-note" id="selectionNote"></div>
    </div>
    <div class="hero">
      <div class="speech">抽个<br>幸运美食<br>吧～</div>
      <div class="box-stage">
        <img class="box-art" src="assets/lottery-box-closed.png" alt="粉色小熊美食盲盒">
      </div>
    </div>
    <div class="action-wrap"><button class="primary-btn" id="startBtn">开始抽奖</button></div>
  </section>

  <section class="screen" id="screen-fly" aria-hidden="true">
    <header class="header">
      <div class="step-pill">步骤 2 · 纸条入盒</div>
      <h1 class="title" aria-label="今天吃什么呢？"><span>今</span><span>天</span><span>吃</span><span>什</span><span>么</span><span>呢</span><span>？</span></h1>
      <div class="subtitle">好运正在装进盒子</div>
    </header>
    <div class="fly-stage">
      <div class="flying-area" id="flyingArea"></div>
      <div class="glow-ring"></div>
      <div class="box-stage">
        <img class="box-art" src="assets/lottery-box-open.png" alt="已经打开的小熊美食盲盒">
      </div>
      <div class="status-pill" id="flyStatus">美食纸条正在飞入盲盒中</div>
    </div>
  </section>

  <section class="screen" id="screen-draw" aria-hidden="true">
    <header class="header">
      <div class="step-pill">步骤 3 · 摇一摇</div>
      <h1 class="title" aria-label="今天吃什么呢？"><span>今</span><span>天</span><span>吃</span><span>什</span><span>么</span><span>呢</span><span>？</span></h1>
      <div class="subtitle">让盲盒替你做决定</div>
    </header>
    <div class="draw-caption" id="shakeTitle">准备好啦！</div>
    <div class="draw-stage">
      <div class="motion-lines" id="motionLines"><i></i><i></i><i></i><i></i></div>
      <div class="box-stage">
        <div class="shake-target" id="shakeBox">
          <img class="box-art" src="assets/lottery-box-closed.png" alt="等待摇动的小熊美食盲盒">
        </div>
      </div>
    </div>
    <div class="draw-hint" id="drawHint">轻轻点一下，抽出今天的幸运美食</div>
    <div class="action-wrap"><button class="primary-btn" id="drawBtn">摇一摇并抽奖</button></div>
  </section>

  <section class="screen result-screen" id="screen-result" aria-hidden="true">
    <header class="header">
      <div class="step-pill">步骤 4 · 今日答案</div>
      <h1 class="title" aria-label="今天吃什么呢？"><span>今</span><span>天</span><span>吃</span><span>什</span><span>么</span><span>呢</span><span>？</span></h1>
      <div class="subtitle">命运的纸条揭晓啦</div>
    </header>
    <div class="ribbon">恭喜你抽中</div>
    <div class="result-stage">
      <div class="rays" aria-hidden="true"></div>
      <div class="celebration" aria-hidden="true"><i>✦</i><i>★</i><i>✧</i></div>
      <div class="result-box"><img class="box-art" src="assets/lottery-box-open.png" alt="打开的小熊美食盲盒"></div>
      <div class="result-slip" id="resultSlip">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-name" id="resultName">披萨</div>
      </div>
      <div class="result-bubble">好吃到<br>起飞～</div>
      <img class="mascot" src="assets/bear-mascot.png" alt="开心庆祝的小熊">
    </div>
    <div class="result-actions">
      <button class="secondary-btn" id="againBtn">再抽一次</button>
      <button class="primary-btn" id="restartBtn">重新选择</button>
    </div>
  </section>

  <div class="modal" id="editModal" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="sheet-handle"></div>
      <h2 id="editTitle">编辑美食纸条</h2>
      <p>添加你正在纠结的选项，最少 2 项，最多 12 项。</p>
      <div class="edit-list" id="editList"></div>
      <div class="add-row">
        <input id="newFoodInput" maxlength="8" placeholder="例如：螺蛳粉" aria-label="新美食名称">
        <button id="addFoodBtn">添加</button>
      </div>
      <div class="sheet-actions">
        <button class="cancel" id="cancelEdit">取消</button>
        <button class="save" id="saveEdit">保存</button>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';

  const ink = '#7f4e42';
  const iconSvgs = {
    hotpot: `<svg viewBox="0 0 64 50"><g fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20h46l-5 19H14z" fill="#ffc86b"/><path d="M5 20h54"/><path d="M18 14c3-7 8-7 11 0M35 14c3-8 8-8 11 0"/><path d="M16 39l-5 5m37-5 5 5"/><path d="M24 26c4-4 11-4 16 0" stroke="#f07c6c"/></g></svg>`,
    sushi: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="22" cy="27" rx="14" ry="9" fill="#fff2d1"/><path d="M8 24c6-8 22-9 28-1-7 4-18 5-28 1z" fill="#ff9a79"/><ellipse cx="44" cy="30" rx="11" ry="8" fill="#fff1ce"/><path d="M34 27h20v7H34z" fill="#2e6f62"/><circle cx="44" cy="30" r="3" fill="#ff8e77"/></g></svg>`,
    chicken: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 34c-9-6-8-17 1-23 8-6 20-2 21 7 1 8-8 16-22 16z" fill="#f3ad58"/><path d="M43 29l8 8"/><path d="M49 34c6-5 10 2 5 5 5 5-3 9-6 3" fill="#fff2d4"/></g></svg>`,
    noodle: `<svg viewBox="0 0 64 50"><g fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 22h42c-2 15-10 22-21 22S13 37 11 22z" fill="#ffb6a9"/><path d="M8 22h48"/><path d="M20 18c1-7 5-7 6 0m5 0c1-7 5-7 6 0m5 0c1-7 5-7 6 0" stroke="#f0b846"/><path d="M45 7l8 13m-1-15 5 15"/></g></svg>`,
    pizza: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 8l43 10-31 26z" fill="#ffd46a"/><path d="M11 8c10 1 30 6 43 10" stroke-width="6" stroke="#e49c55"/><circle cx="29" cy="22" r="4" fill="#ef786b"/><circle cx="38" cy="30" r="4" fill="#ef786b"/><circle cx="24" cy="33" r="3" fill="#ef786b"/></g></svg>`,
    burger: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 23c2-11 12-17 22-17s20 6 22 17z" fill="#f6bd5e"/><path d="M11 38h42c0 6-8 8-21 8s-21-2-21-8z" fill="#f6bd5e"/><path d="M9 28h46l-7 8H15z" fill="#6ab77b"/><path d="M13 24h38v7H13z" fill="#c56b55"/><path d="M20 12h1m10-3h1m10 4h1"/></g></svg>`,
    malatang: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21h44l-6 23H16z" fill="#ff9f80"/><path d="M8 21h48"/><path d="M20 16l-4-10m16 10V5m12 11 5-10"/><circle cx="16" cy="6" r="3" fill="#ffd46a"/><rect x="28" y="3" width="8" height="7" rx="2" fill="#93c57f"/><path d="M48 6l6-3"/></g></svg>`,
    milktea: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12h28l-3 30H21z" fill="#ffe0b6"/><path d="M14 12h36"/><path d="M28 5l6 7m4-7-6 7"/><circle cx="24" cy="34" r="3" fill="#9d6f5c"/><circle cx="32" cy="38" r="3" fill="#9d6f5c"/><circle cx="39" cy="34" r="3" fill="#9d6f5c"/></g></svg>`,
    generic: `<svg viewBox="0 0 64 50"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22h40c0 14-8 23-20 23S12 36 12 22z" fill="#ffd46a"/><path d="M9 22h46"/><path d="M21 16c1-7 5-7 6 0m5 0c1-7 5-7 6 0m5 0c1-7 5-7 6 0" fill="none" stroke="#f09b74"/></g></svg>`
  };

  const baseFoods = [
    {name:'火锅',icon:'hotpot'},{name:'寿司',icon:'sushi'},
    {name:'炸鸡',icon:'chicken'},{name:'拉面',icon:'noodle'},
    {name:'披萨',icon:'pizza'},{name:'汉堡',icon:'burger'},
    {name:'麻辣烫',icon:'malatang'},{name:'奶茶',icon:'milktea'}
  ];
  const iconPool = ['generic','noodle','pizza','hotpot','burger','milktea'];
  const screens = ['select','fly','draw','result'];
  const $ = selector => document.querySelector(selector);

  let foods = loadFoods();
  let editingFoods = [];
  let phase = 'select';
  let result = null;
  let runId = 0;
  let timers = [];
  let toastTimer = 0;

  function loadFoods(){
    let parsed = null;
    try {
      parsed = JSON.parse(localStorage.getItem('cuteFoodDrawFoodsOptimized') || localStorage.getItem('cuteFoodDrawFoods') || 'null');
    } catch (_) {}
    if (!Array.isArray(parsed) || parsed.length < 2) parsed = baseFoods;
    const clean = parsed.slice(0,12).filter(item => item && typeof item.name === 'string' && item.name.trim()).map((item,index) => ({
      name:item.name.trim().slice(0,8),
      icon:iconSvgs[item.icon] ? item.icon : iconPool[index % iconPool.length],
      selected:item.selected !== false
    }));
    return clean.length >= 2 ? clean : baseFoods.map(item => ({...item,selected:true}));
  }

  function saveFoods(){
    try {
      localStorage.setItem('cuteFoodDrawFoodsOptimized',JSON.stringify(foods));
      return true;
    } catch (_) {
      toast('浏览器未允许保存，但本次仍可使用');
      return false;
    }
  }

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,char => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[char]);
  }
  function icon(food,className='doodle'){
    return `<div class="${className}">${iconSvgs[food.icon] || iconSvgs.generic}</div>`;
  }
  function selectedFoods(){ return foods.filter(food => food.selected); }

  function clearTimers(){
    timers.forEach(timer => clearTimeout(timer));
    timers = [];
  }
  function later(callback,delay,currentRun=runId){
    const timer = setTimeout(() => {
      if (currentRun === runId) callback();
    },delay);
    timers.push(timer);
    return timer;
  }
  function setPhase(next){
    phase = next;
    screens.forEach(name => {
      const active = name === next;
      const screen = $('#screen-' + name);
      screen.classList.toggle('active',active);
      screen.setAttribute('aria-hidden',String(!active));
    });
  }
  function beginRun(next){
    runId += 1;
    clearTimers();
    setPhase(next);
    return runId;
  }
  function toast(message){
    const element = $('#toast');
    clearTimeout(toastTimer);
    element.textContent = message;
    element.classList.add('show');
    toastTimer = setTimeout(() => element.classList.remove('show'),1650);
  }

  function renderFoods(){
    const grid = $('#foodGrid');
    grid.innerHTML = foods.map((food,index) =>
      `<button class="food-card ${food.selected ? 'selected' : 'off'}" data-index="${index}" aria-pressed="${food.selected}" aria-label="${escapeHtml(food.name)}，${food.selected ? '已选中' : '未选中'}">${icon(food)}<div class="food-name">${escapeHtml(food.name)}</div></button>`
    ).join('');
    grid.querySelectorAll('.food-card').forEach(card => {
      card.addEventListener('click',() => {
        if (phase !== 'select') return;
        const index = Number(card.dataset.index);
        foods[index].selected = !foods[index].selected;
        renderFoods();
        tinyTap();
      });
    });
    const count = selectedFoods().length;
    $('#selectionNote').textContent = `已选择 ${count} / ${foods.length} 项，点纸条可以切换`;
    $('#startBtn').disabled = count < 2 || phase !== 'select';
  }

  function startLottery(){
    if (phase !== 'select') return;
    const chosen = selectedFoods().map(food => ({...food}));
    if (chosen.length < 2){
      toast('至少选两项哦');
      return;
    }
    $('#startBtn').disabled = true;
    const currentRun = beginRun('fly');
    const area = $('#flyingArea');
    area.innerHTML = '';
    $('#flyStatus').textContent = '美食纸条正在飞入盲盒中';
    const positions = [
      [-132,-20,-9],[-56,-70,5],[52,-66,-6],[128,-18,8],
      [-108,38,7],[-20,10,-8],[78,34,6],[124,74,-5],
      [-68,86,5],[30,80,-4],[-124,108,-7],[92,112,6]
    ];
    chosen.forEach((food,index) => {
      const [x,y,rotation] = positions[index % positions.length];
      const slip = document.createElement('div');
      slip.className = 'flying-slip';
      slip.style.setProperty('--sx',x + 'px');
      slip.style.setProperty('--sy',y + 'px');
      slip.style.setProperty('--rot',rotation + 'deg');
      slip.style.setProperty('--delay',(index * .1) + 's');
      slip.innerHTML = `${icon(food,'mini-icon')}<span>${escapeHtml(food.name)}</span>`;
      area.appendChild(slip);
      requestAnimationFrame(() => slip.classList.add('fly'));
    });
    sparkleSound();
    const duration = Math.max(1850,chosen.length * 105 + 1300);
    later(() => { $('#flyStatus').textContent = '全部装好啦，准备开奖！'; },duration - 340,currentRun);
    later(() => {
      setPhase('draw');
      $('#shakeTitle').textContent = '准备好啦！';
      $('#drawHint').textContent = '轻轻点一下，抽出今天的幸运美食';
      $('#drawBtn').disabled = false;
    },duration + 240,currentRun);
  }

  function performDraw(){
    if (phase !== 'draw' || $('#drawBtn').disabled) return;
    const chosen = selectedFoods().map(food => ({...food}));
    if (chosen.length < 2){
      restart();
      toast('候选项发生变化，请重新选择');
      return;
    }
    const currentRun = runId;
    result = chosen[Math.floor(Math.random() * chosen.length)];
    const button = $('#drawBtn');
    const box = $('#shakeBox');
    const lines = $('#motionLines');
    button.disabled = true;
    $('#shakeTitle').textContent = '摇一摇中…';
    $('#drawHint').textContent = '正在替你抽出今天的幸运美食';
    box.classList.remove('shaking');
    void box.offsetWidth;
    box.classList.add('shaking');
    lines.classList.add('show');
    shakeSound();
    if (navigator.vibrate) navigator.vibrate([40,35,65,35,90]);
    later(() => {
      lines.classList.remove('show');
      box.classList.remove('shaking');
      $('#resultName').textContent = result.name;
      $('#resultIcon').innerHTML = iconSvgs[result.icon] || iconSvgs.generic;
      const slip = $('#resultSlip');
      slip.style.animation = 'none';
      void slip.offsetWidth;
      slip.style.animation = '';
      setPhase('result');
      winSound();
    },1280,currentRun);
  }

  function again(){
    if (phase !== 'result') return;
    beginRun('draw');
    $('#shakeTitle').textContent = '再来一次！';
    $('#drawHint').textContent = '轻轻点一下，看看这次会抽中什么';
    $('#drawBtn').disabled = false;
  }
  function restart(){
    beginRun('select');
    result = null;
    renderFoods();
  }

  function openEdit(){
    if (phase !== 'select') return;
    editingFoods = foods.map(food => ({...food}));
    renderEdit();
    $('#editModal').classList.add('show');
    $('#editModal').setAttribute('aria-hidden','false');
    later(() => $('#newFoodInput').focus(),80,runId);
  }
  function closeEdit(){
    $('#editModal').classList.remove('show');
    $('#editModal').setAttribute('aria-hidden','true');
    $('#editBtn').focus();
  }
  function renderEdit(){
    const list = $('#editList');
    list.innerHTML = editingFoods.map((food,index) =>
      `<div class="edit-chip">${escapeHtml(food.name)}<button data-index="${index}" aria-label="删除 ${escapeHtml(food.name)}">×</button></div>`
    ).join('');
    list.querySelectorAll('button').forEach(button => {
      button.addEventListener('click',() => {
        if (editingFoods.length <= 2){
          toast('至少保留两项哦');
          return;
        }
        editingFoods.splice(Number(button.dataset.index),1);
        renderEdit();
      });
    });
  }
  function addFood(){
    const input = $('#newFoodInput');
    const name = input.value.trim();
    if (!name) return;
    if (editingFoods.length >= 12){
      toast('最多添加 12 项');
      return;
    }
    if (editingFoods.some(food => food.name === name)){
      toast('这个选项已经有啦');
      return;
    }
    editingFoods.push({name:name.slice(0,8),icon:iconPool[editingFoods.length % iconPool.length],selected:true});
    input.value = '';
    renderEdit();
    tinyTap();
  }
  function saveEdit(){
    if (editingFoods.length < 2){
      toast('至少保留两项哦');
      return;
    }
    foods = editingFoods.map(food => ({...food}));
    saveFoods();
    renderFoods();
    closeEdit();
  }

  function audioContext(){
    try {
      window.__foodLotteryAudio = window.__foodLotteryAudio || new (window.AudioContext || window.webkitAudioContext)();
      return window.__foodLotteryAudio;
    } catch (_) { return null; }
  }
  function tone(frequency=440,duration=.08,type='sine',volume=.022,delay=0){
    const context = audioContext();
    if (!context) return;
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(.0001,context.currentTime + delay);
    gain.gain.linearRampToValueAtTime(volume,context.currentTime + delay + .012);
    gain.gain.exponentialRampToValueAtTime(.0001,context.currentTime + delay + duration);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start(context.currentTime + delay);
    oscillator.stop(context.currentTime + delay + duration + .03);
  }
  function tinyTap(){ tone(560,.055,'sine',.014); }
  function sparkleSound(){ [520,680,820].forEach((frequency,index) => tone(frequency,.12,'sine',.016,index * .09)); }
  function shakeSound(){ [180,240,190,270,210].forEach((frequency,index) => tone(frequency,.11,'triangle',.017,index * .16)); }
  function winSound(){ [523,659,784,1047].forEach((frequency,index) => tone(frequency,.25,'sine',.025,index * .09)); }

  $('#startBtn').addEventListener('click',startLottery);
  $('#drawBtn').addEventListener('click',performDraw);
  $('#againBtn').addEventListener('click',again);
  $('#restartBtn').addEventListener('click',restart);
  $('#editBtn').addEventListener('click',openEdit);
  $('#cancelEdit').addEventListener('click',closeEdit);
  $('#saveEdit').addEventListener('click',saveEdit);
  $('#addFoodBtn').addEventListener('click',addFood);
  $('#newFoodInput').addEventListener('keydown',event => {
    if (event.key === 'Enter') addFood();
    if (event.key === 'Escape') closeEdit();
  });
  $('#editModal').addEventListener('click',event => {
    if (event.target.id === 'editModal') closeEdit();
  });
  document.addEventListener('keydown',event => {
    if (event.key === 'Escape' && $('#editModal').classList.contains('show')) closeEdit();
  });

  renderFoods();
})();
</script>
</body>
</html>
